[project]
name = "pkcore"
version = "0.1.0"
description = "Small, verifiable pharmacokinetic computation engine (research and education; not a medical device)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lidianchia" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/lidianchia/pkcore"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8.8"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PT", "NPY", "PL", "TRY", "DTZ"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
# SciPy ships no type information; it is only used by tests/reference.py.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    # SciPy is used only by the independent reference implementations in tests/.
    # 1.18.0 has a batched expm accuracy regression (scipy/scipy#25924); 1.18.x needs
    # Python >= 3.12, so Python 3.11 uses the last release line that supports it.
    "scipy>=1.18.1; python_version >= '3.12'",
    "scipy>=1.17.1,<1.18; python_version < '3.12'",
]
